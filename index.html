<!DOCTYPE html>
<html lang="es-CO">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turnes">
  <!-- 🟢 CORRECCIÓN: Añadimos la base URL para asegurar el enrutamiento -->
  <base href="/">
  <meta name="theme-color" content="#09090b" />
  <meta name="description" content="Turnes: La plataforma líder para conectar talento operativo de hospitalidad y construcción con empresas de primer nivel." />
  <meta name="keywords" content="empleo, turnos, hospitalidad, construcción, colombia, vacantes, restaurante, mesero, chef, constructor" />
  <meta name="author" content="Turnes Inc." />
  
  <!-- Open Graph / Default Social Meta Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Turnes - Trabajo y Turnos Flexibles" />
  <meta property="og:description" content="Conecta con las mejores empresas de hospitalidad y construcción en Colombia." />
  <meta property="og:image" content="https://turnes.co/logo-turnes.png" />
  <meta property="og:url" content="https://turnes.co/" />

  <link rel="icon" type="image/png" href="/pwa-192x192.png" />
  <link rel="apple-touch-icon" href="/pwa-512x512.png" />
  
  <!-- LCP Optimization: Preload Hero Image -->


  <!-- LEAFLET CSS CDN (Absolute Safety Net) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <title>Turnes</title>
</head>

<body style="background-color: #09090b; margin: 0;">
  <noscript>Necesitas habilitar JavaScript para ejecutar esta app.</noscript>

  <div id="root">
    <!-- PWA NATIVE SPLASH SCREEN (Instantly Visible) -->
    <style>
      #pwa-splash {
        position: fixed;
        inset: 0;
        background-color: #09090b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .pwa-logo-container {
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, #18181b 0%, #09090b 100%);
        border: 1px solid #27272a;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
        margin-bottom: 30px;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .pwa-logo-container img {
        width: 60px;
        height: 60px;
        object-fit: contain;
      }
      .pwa-loader {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: #21c99a;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .8; transform: scale(0.98); } }
    </style>
    <div id="pwa-splash">
      <div class="pwa-logo-container">
        <img src="/pwa-192x192.png" alt="Turnes" />
      </div>
      <div class="pwa-loader"></div>
    </div>
  </div>

  <!-- ESTA ES LA LÍNEA MÁGICA QUE VITE NECESITA -->
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
